name: preview PR
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed
    paths:
      - css/**
      - src/**
      - vite.config.ts
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/preview.yml
concurrency: preview-${{ github.ref }}
jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Enable pnpm
        run: corepack enable pnpm
      - name: Install
        run: pnpm install
      - name: Build
        run: pnpm run build
      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist
